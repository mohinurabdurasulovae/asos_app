        - bearerAuth: []
        - {}
      parameters:
        - { name: community, in: query, schema: { type: string }, description: "Jamoa slug'i yoki `all`" }
        - name: sort
          in: query
          schema: { type: string, enum: [popular, new, unanswered, subscriptions], default: popular }
          description: '`subscriptions` token talab qiladi'
        - { name: q,       in: query, schema: { type: string } }
