        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/posts/{id}/comments:
    get:
      tags: [Hamjamiyat]
      summary: Izohlar
      description: "Ikki qatlamli daraxt: ildiz izohlar va ularning javoblari."
      security:
        - bearerAuth: []
        - {}
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: commentSort, in: query, schema: { type: string, enum: [best, new], default: best } }
      responses:
        '200':
          description: Izohlar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Comment' }
        '404': { $ref: '#/components/responses/NotFound' }
