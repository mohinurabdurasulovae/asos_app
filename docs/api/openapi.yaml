openapi: 3.0.3

info:
  title: Asos API
  version: 1.0.0
  description: |
    «Asos» — O‘zbekiston Respublikasi Konstitutsiyasini o‘qish, tushunish va
    hayotda qo‘llash uchun mobil ilovaning backend'i.

    ## Umumiy qoidalar

    * Hamma javob JSON. Muvaffaqiyatli javobda `"ok": true`, xatoda `"ok": false`.
    * Xato javobi: `{ "ok": false, "error": "<kod>", "message": "<o‘zbekcha matn>" }`.
      `message` ilovada o‘zgartirmasdan ko‘rsatishga yaroqli.
    * Vaqt — UTC, `YYYY-MM-DD HH:MM:SS` ko‘rinishida.
    * Ro‘yxatlar bir xil shaklda: `{ ok, items, meta: { total, page, perPage, pages, hasMore } }`.
    * Sahifalash: `?page=1&perPage=20`.
    * Kirish — `Authorization: Bearer <accessToken>`.
    * Bir IP uchun daqiqada 120 so‘rov; oshsa `429` va `Retry-After` sarlavhasi.
    * Brauzer sahifalari (`/`, `/docs`, `/openapi.yaml`) kod bilan to‘silgan.
      `/v1/…` endpointlari **to‘silmaydi** — mobil ilova kodni bilmaydi.
    * Qurilma nomini `X-Asos-Device` sarlavhasida yuborsangiz, u faol
      qurilmalar ro‘yxatida ko‘rinadi.

    ## Kirish oqimi

    1. `POST /v1/auth/request-code` — telefon raqamga SMS kodi yuboriladi.
       Rivojlanish rejimida (`dev_mode: true`) javobda `devCode` ham qaytadi.
    2. `POST /v1/auth/verify` — kod to‘g‘ri bo‘lsa, token va foydalanuvchi qaytadi.
       Raqam birinchi marta ko‘rilsa, akkaunt shu yerda yaratiladi (`isNew: true`).
    3. Keyingi so‘rovlarda `Authorization: Bearer <accessToken>`.

    ## Ekran — endpoint

    | Ekran | Endpoint |
    |---|---|
    | Bosh sahifa | `GET /v1/home` |
    | Konstitutsiya | `GET /v1/constitution` |
    | Modda | `GET /v1/articles/{raqam}` |
    | Lug‘at | `GET /v1/terms` |
    | O‘rganish | `GET /v1/learn` |
    | Test savoli | `POST /v1/quizzes/{id}/attempts` → `POST /v1/attempts/{id}/answers` |
    | Kazuslar | `GET /v1/cases` |
    | Kazus | `GET /v1/cases/{raqam}` → `POST /v1/cases/{raqam}/check` |
    | Hamjamiyat | `GET /v1/posts` |
    | Muhokama | `GET /v1/posts/{id}` |
    | Huquqiy yordam | `GET /v1/help` |
    | Chat | `GET /v1/conversations/{id}` |
    | Profil | `GET /v1/me/profile` |

    ## Kontent

    Konstitutsiyaning to‘liq rasmiy matni bazada: 6 bo‘lim, 27 bob, 155 modda
    va 10 bandli muqaddima, bandlarga ajratilgan holda. Manba —
    [lex.uz](https://lex.uz/uz/docs/-6445145), 2023-yil 30-aprel referendumida
    qabul qilingan tahrir (amaldagi o‘zgartirishlar bilan). Matn o‘zgartirilmagan.

    Rasmiy matnda moddalarning **sarlavhasi yo‘q**. 12 ta moddaga tahririt
    sarlavha berilgan; qolganlarida `title` — moddaning raqami va
    `titleAuto: true`. Ro‘yxatlarda `excerpt` (matnning birinchi satri) ishlating.

    Sodda tilda izoh (`plain`), hayotiy misollar (`examples`), testlar va
    kazuslar — **tahririy kontent**, rasmiy matn emas.

  contact:
    name: Asos API
    url: https://asos.api.berdiklichev.uz/docs

servers:
  - url: https://asos.api.berdiklichev.uz
    description: Ishlab turgan server
  - url: http://127.0.0.1:8080
    description: Lokal (php -S 127.0.0.1:8080 index.php)

tags:
  - name: Meta
    description: Xizmat holati va ilova sozlamalari
  - name: Kirish
    description: Telefon + SMS kodi, tokenlar, qurilmalar
  - name: Profil
    description: O‘zim, statistika, yutuqlar, saqlanganlar, bildirishnomalar
  - name: Konstitutsiya
    description: Bo‘lim, bob, modda, mavzu, qidiruv
  - name: Lug‘at
    description: Konstitutsiyaviy atamalar
  - name: O‘rganish
    description: Testlar, urinishlar, kunlik savol
  - name: Kazuslar
    description: Hayotiy vaziyat → modda → yechim
  - name: Hamjamiyat
    description: Jamoalar, muhokamalar, izohlar, ovozlar
  - name: Yordam
    description: Ishonch telefoni, advokatlar, chat, AI, band qilish

security:
  - bearerAuth: []

paths:

  # ------------------------------------------------------------------ Meta

  /v1/health:
    get:
      tags: [Meta]
      summary: Xizmat holati
      description: Monitoring uchun. Bazaga ulanishni va seed holatini ko‘rsatadi.
      security: []
      responses:
        '200':
          description: Holat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      php:      { type: string, example: '8.2.12' }
                      driver:   { type: string, enum: [mysql, sqlite] }
                      schema:   { type: integer, example: 1 }
                      articles: { type: integer, example: 156 }
                      seeded:   { type: string, nullable: true }
                      time:     { type: string }
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/config:
    get:
      tags: [Meta]
      summary: Ilova sozlamalari
      description: |
        Ilova ishga tushganda bir marta oladi: tuzilish raqamlari, ball
        qiymatlari, darajalar, lug‘at alifbosi va ogohlantirish matnlari.
        `ETag` qo‘yiladi — o‘zgarmagan bo‘lsa `304` qaytadi.
      security: []
      responses:
        '200':
          description: Sozlamalar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      version:      { type: string }
                      constitution: { $ref: '#/components/schemas/ConstitutionStats' }
                      letters:
                        type: array
                        items: { $ref: '#/components/schemas/Letter' }
                      points:
                        type: object
                        properties:
                          perArticle:  { type: integer, example: 10 }
                          perQuestion: { type: integer, example: 20 }
                          casePerfect: { type: integer, example: 40 }
                          casePartial: { type: integer, example: 15 }
                      levels:
                        type: array
                        items: { $ref: '#/components/schemas/Level' }
                      difficulties: { type: array, items: { type: string } }
                      postSorts:    { type: array, items: { type: string } }
                      bookmarkKinds: { type: array, items: { type: string } }
                      locales:      { type: array, items: { type: string } }
                      textSizes:    { type: array, items: { type: string } }
                      disclaimers:
                        type: object
                        properties:
                          plain: { type: string }
                          ai:    { type: string }
                          post:  { type: string }
                      minAppVersion: { type: string }
        '304':
          description: O‘zgarmagan (If-None-Match)

  # ----------------------------------------------------------------- Kirish

  /v1/auth/request-code:
    post:
      tags: [Kirish]
      summary: SMS kodi yuborish
      description: |
        Bitta raqamga ketma-ket kod yuborish orasida kamida 60 sekund tanaffus.
        Kod 5 daqiqa amal qiladi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: '+998901234567, 998901234567 yoki 901234567 — hammasi qabul qilinadi'
                  example: '+998901234567'
      responses:
        '200':
          description: Kod yuborildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      phone:     { type: string, example: '+998901234567' }
                      expiresIn: { type: integer, example: 300 }
                      resendIn:  { type: integer, example: 60 }
                      devCode:
                        type: string
                        description: "Faqat `dev_mode: true` bo‘lganda. Serverda qaytmaydi."
                        example: '123456'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          description: Tanaffus tugamagan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      retryAfter: { type: integer, example: 42 }

  /v1/auth/verify:
    post:
      tags: [Kirish]
      summary: Kodni tasdiqlash va token olish
      description: Raqam birinchi marta ko‘rilsa, akkaunt shu yerda yaratiladi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, example: '+998901234567' }
                code:  { type: string, example: '123456' }
      responses:
        '200':
          description: Kirish muvaffaqiyatli
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      token: { $ref: '#/components/schemas/Token' }
                      user:  { $ref: '#/components/schemas/Me' }
                      isNew: { type: boolean, description: Akkaunt shu so‘rovda yaratildimi }
        '401':
          description: Kod xato
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      triesLeft: { type: integer, example: 3 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: Kod yuborilmagan yoki muddati tugagan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
        '429':
          description: Urinishlar tugadi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/auth/oauth:
    post:
      tags: [Kirish]
      summary: OneID yoki Google orqali kirish
      description: |
        Provayder tokenini tekshirish ilova yoki provayder tomonida bo‘ladi;
        bu endpoint barqaror `subject` (provayderdagi id) kutadi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, subject]
              properties:
                provider: { type: string, enum: [oneid, google] }
                subject:  { type: string, example: 'oneid-7781234' }
                email:    { type: string, format: email }
                name:     { type: string, example: 'Aziza Karimova' }
      responses:
        '200':
          description: Kirish muvaffaqiyatli
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      token: { $ref: '#/components/schemas/Token' }
                      user:  { $ref: '#/components/schemas/Me' }
                      isNew: { type: boolean }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/auth/logout:
    post:
      tags: [Kirish]
      summary: Shu qurilmadan chiqish
      responses:
        '200':
          description: Token bekor qilindi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { loggedOut: { type: boolean } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/logout-all:
    post:
      tags: [Kirish]
      summary: Barcha qurilmalardan chiqish
      responses:
        '200':
          description: Hamma token bekor qilindi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { loggedOut: { type: boolean } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/sessions:
    get:
      tags: [Kirish]
      summary: Faol qurilmalar
      description: «Maxfiylik va xavfsizlik» ekrani uchun.
      responses:
        '200':
          description: Qurilmalar ro‘yxati
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/sessions/{id}:
    delete:
      tags: [Kirish]
      summary: Bitta qurilmani chiqarish
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Bekor qilindi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { revoked: { type: boolean } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/devices:
    post:
      tags: [Kirish]
      summary: Push token qo‘shish yoki yangilash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pushToken]
              properties:
                pushToken:  { type: string }
                platform:   { type: string, enum: [android, ios, web], default: android }
                appVersion: { type: string, example: 1.0.0 }
      responses:
        '200':
          description: Saqlandi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { registered: { type: boolean } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/devices/{token}:
    delete:
      tags: [Kirish]
      summary: Push tokenni olib tashlash
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: O‘chirildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { removed: { type: boolean } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------- Bosh sahifa

  /v1/home:
    get:
      tags: [Meta]
      summary: Bosh sahifa — butun ekran bitta so‘rovda
      description: |
        Tokensiz ham ishlaydi (mehmon ko‘rinishi). Token bilan qo‘shimcha
        `user`, `continue`, `dailyGoal` va `unreadNotifications` qaytadi.
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Bosh sahifa ma’lumotlari
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      greeting:
                        type: string
                        description: Toshkent vaqtiga qarab salomlashish
                        example: Xayrli kech
                      articleOfDay: { $ref: '#/components/schemas/ArticleOfDay' }
                      termOfDay:
                        type: object
                        nullable: true
                        properties:
                          term:     { type: string }
                          slug:     { type: string }
                          shortDef: { type: string }
                      topics:
                        type: array
                        items: { $ref: '#/components/schemas/Topic' }
                      caseOfWeek:    { $ref: '#/components/schemas/CaseBrief' }
                      dailyQuestion: { $ref: '#/components/schemas/DailyQuestion' }
                      help:
                        type: object
                        properties:
                          hotline:       { $ref: '#/components/schemas/Hotline' }
                          lawyersOnline: { type: integer }
                          aiSuggestions: { type: array, items: { type: string } }
                      community:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/PostBrief' }
                      user:     { $ref: '#/components/schemas/Me' }
                      continue: { $ref: '#/components/schemas/ReadingOverview' }
                      dailyGoal: { $ref: '#/components/schemas/DailyGoal' }
                      unreadNotifications: { type: integer }

  # ----------------------------------------------------------- Konstitutsiya

  /v1/constitution:
    get:
      tags: [Konstitutsiya]
      summary: Bo‘lim va boblar daraxti
      description: Token berilsa, har bobda o‘qilgan modda soni va foizi qaytadi.
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Daraxt
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      stats: { $ref: '#/components/schemas/ConstitutionStats' }
                      sections:
                        type: array
                        items: { $ref: '#/components/schemas/Section' }

  /v1/constitution/stats:
    get:
      tags: [Konstitutsiya]
      summary: Tuzilish raqamlari
      security: []
      responses:
        '200':
          description: 6 bo‘lim · 27 bob · 155 modda
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - $ref: '#/components/schemas/ConstitutionStats'
        '304': { description: O‘zgarmagan }

  /v1/topics:
    get:
      tags: [Konstitutsiya]
      summary: Mavzular
      security: []
      responses:
        '200':
          description: Mavzular ro‘yxati
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Topic' }
        '304': { description: O‘zgarmagan }

  /v1/chapters/{roman}:
    get:
      tags: [Konstitutsiya]
      summary: Bitta bob va uning moddalari
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: roman
          in: path
          required: true
          description: Bobning rim raqami
          schema: { type: string }
          example: IX
      responses:
        '200':
          description: Bob
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      chapter: { $ref: '#/components/schemas/Chapter' }
                      section:
                        type: object
                        nullable: true
                        properties:
                          roman: { type: string }
                          title: { type: string }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ArticleBrief' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/articles:
    get:
      tags: [Konstitutsiya]
      summary: Moddalar ro‘yxati
      security:
        - bearerAuth: []
        - {}
      parameters:
        - { name: topic,   in: query, schema: { type: string }, description: Mavzu slug'i, example: talim }
        - { name: chapter, in: query, schema: { type: string }, description: Bobning rim raqami }
        - { name: section, in: query, schema: { type: string }, description: Bo‘limning rim raqami }
        - { name: q,       in: query, schema: { type: string }, description: Modda raqami yoki so‘z }
        - name: status
          in: query
          description: Faqat token bilan ishlaydi
          schema: { type: string, enum: [read, unread, saved] }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Moddalar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ArticleBrief' }

  /v1/articles/of-the-day:
    get:
      tags: [Konstitutsiya]
      summary: Kun moddasi
      description: Kunga bog‘langan barqaror tanlov — bir kun ichida o‘zgarmaydi.
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Kun moddasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      article: { $ref: '#/components/schemas/ArticleOfDay' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/articles/{key}:
    get:
      tags: [Konstitutsiya]
      summary: Bitta modda — to‘liq
      description: |
        «Modda» ekranining hammasi: rasmiy matn (`parts`), sodda tilda
        (`plain`), hayotiy misollar (`examples`), bog‘liq moddalar, lug‘atdagi
        atamalar, muhokamalar soni, tegishli test va qo‘shni moddalar.

        **Diqqat:** rasmiy matni hali kiritilmagan moddalarda `parts` bo‘sh
        massiv bo‘ladi.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/articleKey'
      responses:
        '200':
          description: Modda
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      article: { $ref: '#/components/schemas/Article' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/articles/{key}/progress:
    post:
      tags: [Konstitutsiya]
      summary: O‘qish holatini saqlash
      description: |
        `status: read` birinchi marta yuborilganda 10 ball beriladi, kunlik
        faollik oshadi va yutuqlar tekshiriladi. Takroriy `read` ball bermaydi.
      parameters:
        - $ref: '#/components/parameters/articleKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:  { type: string, enum: [reading, read], default: read }
                seconds: { type: integer, minimum: 0, maximum: 86400, description: Shu moddada o‘tgan vaqt }
      responses:
        '200':
          description: Saqlandi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      status:       { type: string }
                      pointsEarned: { type: integer, example: 10 }
                      points:       { type: integer, description: Yangi umumiy ball }
                      streakDays:   { type: integer }
                      achievements:
                        type: array
                        items: { $ref: '#/components/schemas/Achievement' }
                      overview: { $ref: '#/components/schemas/ReadingOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/articles/{key}/posts:
    get:
      tags: [Konstitutsiya]
      summary: Moddaga tegishli muhokamalar
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/articleKey'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Muhokamalar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PostBrief' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/search:
    get:
      tags: [Konstitutsiya]
      summary: Birlashgan qidiruv
      description: Moddalar, lug‘at atamalari va muhokamalar bo‘yicha.
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 }, example: ta’lim }
        - { name: limit, in: query, schema: { type: integer, default: 8, minimum: 1, maximum: 30 } }
      responses:
        '200':
          description: Natijalar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      query: { type: string }
                      articles:
                        type: array
                        items:
                          type: object
                          properties:
                            number: { type: integer }
                            title:  { type: string }
                            slug:   { type: string }
                      terms:
                        type: array
                        items:
                          type: object
                          properties:
                            slug:     { type: string }
                            term:     { type: string }
                            shortDef: { type: string }
                      posts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:           { type: integer }
                            title:        { type: string }
                            upvotes:      { type: integer }
                            commentCount: { type: integer }
        '422': { $ref: '#/components/responses/Validation' }

  # ----------------------------------------------------------------- Lug'at

  /v1/terms:
    get:
      tags: [Lug‘at]
      summary: Atamalar ro‘yxati
      security:
        - bearerAuth: []
        - {}
      parameters:
        - { name: letter, in: query, schema: { type: string }, example: D }
        - { name: q,      in: query, schema: { type: string } }
        - { name: saved,  in: query, schema: { type: string, enum: ['1'] }, description: Faqat saqlanganlar (token kerak) }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Atamalar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TermBrief' }
                      letters:
                        type: array
                        items: { $ref: '#/components/schemas/Letter' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/terms/letters:
    get:
      tags: [Lug‘at]
      summary: Alifbo reykasi
      description: O‘zbek lotin alifbosi (29 element, `O‘`, `G‘`, `Sh`, `Ch`, `Ng` bilan) va har harfdagi atama soni.
      security: []
      responses:
        '200':
          description: Harflar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Letter' }
        '304': { description: O‘zgarmagan }

  /v1/terms/of-the-day:
    get:
      tags: [Lug‘at]
      summary: Kun atamasi
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Kun atamasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      term: { $ref: '#/components/schemas/Term' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/terms/{slug}:
    get:
      tags: [Lug‘at]
      summary: Bitta atama
      security:
        - bearerAuth: []
        - {}
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string }, example: daxlsizlik }
      responses:
        '200':
          description: Atama
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      term: { $ref: '#/components/schemas/Term' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------- Profil

  /v1/me:
    get:
      tags: [Profil]
      summary: O‘zim
      responses:
        '200':
          description: Foydalanuvchi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      user: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profil]
      summary: Profilni o‘zgartirish
      description: Faqat yuborilgan maydonlar o‘zgaradi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:        { type: string, minLength: 2, maxLength: 120 }
                city:        { type: string, nullable: true }
                username:
                  type: string
                  nullable: true
                  description: 'Harf yoki raqamdan boshlanadi, 3–60 belgi. Boshidagi @ olib tashlanadi.'
                dailyGoal:   { type: integer, minimum: 1, maximum: 20 }
                locale:      { type: string, enum: [uz-Latn, uz-Cyrl, ru, en] }
                textSize:    { type: string, enum: [small, medium, large, xlarge] }
                notifyDaily: { type: boolean }
      responses:
        '200':
          description: Yangilandi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      user: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Taxallus band
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Profil]
      summary: Akkauntni o‘chirish
      description: |
        Shaxsiy ma’lumotlar o‘chadi, hamjamiyatdagi postlar va izohlar anonim
        bo‘lib qoladi (muhokamalar buzilmasligi uchun). Hamma token bekor qilinadi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, enum: ['DELETE'] }
      responses:
        '200':
          description: O‘chirildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { deleted: { type: boolean } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/me/profile:
    get:
      tags: [Profil]
      summary: Profil ekrani — butun ekran bitta so‘rovda
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      user: { $ref: '#/components/schemas/Me' }
                      stats:
                        type: object
                        properties:
                          points:       { type: integer, example: 1240 }
                          quizzesDone:  { type: integer, example: 18 }
                          casesSolved:  { type: integer, example: 7 }
                          articlesRead: { type: integer, example: 59 }
                          percent:      { type: integer, example: 38 }
                          streakDays:   { type: integer, example: 7 }
                      week: { $ref: '#/components/schemas/WeekActivity' }
                      dailyGoal: { $ref: '#/components/schemas/DailyGoal' }
                      achievements:
                        type: object
                        properties:
                          earned: { type: integer, example: 3 }
                          total:  { type: integer, example: 12 }
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Achievement' }
                      bookmarks:
                        type: object
                        description: Saqlanganlar soni turlar bo‘yicha
                        properties:
                          article: { type: integer, example: 8 }
                          term:    { type: integer, example: 12 }
                          post:    { type: integer, example: 5 }
                          case:    { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/progress:
    get:
      tags: [Profil]
      summary: O‘qish jarayoni
      responses:
        '200':
          description: Umumiy natija va «davom ettiring»
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - $ref: '#/components/schemas/ReadingOverview'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/achievements:
    get:
      tags: [Profil]
      summary: Yutuqlar
      description: Olinganlari birinchi.
      responses:
        '200':
          description: Yutuqlar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Achievement' }
                      earned: { type: integer }
                      total:  { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/achievements/recount:
    post:
      tags: [Profil]
      summary: Yutuqlarni qayta sanash
      description: Migratsiya yoki seed'dan keyin foydali.
      responses:
        '200':
          description: Qayta sanaldi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      newlyEarned:
                        type: array
                        items: { $ref: '#/components/schemas/Achievement' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/points:
    get:
      tags: [Profil]
      summary: Ballar tarixi
      description: "Har bir ball qayerdan kelgani — `reason`: article, quiz, case."
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Daftar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      balance: { type: integer }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:        { type: integer }
                            delta:     { type: integer }
                            reason:    { type: string, enum: [article, quiz, case, streak] }
                            note:      { type: string, nullable: true }
                            createdAt: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/bookmarks:
    get:
      tags: [Profil]
      summary: Saqlanganlar
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [article, term, post, case], default: article } }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Saqlangan yozuvlar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      kind:   { type: string }
                      counts: { type: object, additionalProperties: { type: integer } }
                      items:  { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Profil]
      summary: Saqlash
      description: |
        `targetId` to‘g‘ridan-to‘g‘ri, yoki qulayroq yo‘l bilan:
        `articleNumber`, `termSlug`, `caseNumber`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:          { type: string, enum: [article, term, post, case] }
                targetId:      { type: integer }
                articleNumber: { type: integer, example: 50 }
                termSlug:      { type: string, example: daxlsizlik }
                caseNumber:    { type: integer, example: 14 }
      responses:
        '200':
          description: Saqlandi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      saved:    { type: boolean }
                      kind:     { type: string }
                      targetId: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/me/bookmarks/{kind}/{id}:
    delete:
      tags: [Profil]
      summary: Saqlanganni olib tashlash
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [article, term, post, case] } }
        - { name: id,   in: path, required: true, schema: { type: integer }, description: Yozuvning ichki id'si }
      responses:
        '200':
          description: Olib tashlandi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { saved: { type: boolean, example: false } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/me/notifications:
    get:
      tags: [Profil]
      summary: Bildirishnomalar
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Bildirishnomalar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      unread: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/notifications/read:
    post:
      tags: [Profil]
      summary: O‘qildi deb belgilash
      description: '`ids` berilmasa — hammasi o‘qilgan deb belgilanadi.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  maxItems: 200
      responses:
        '200':
          description: Belgilandi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { unread: { type: integer } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/leaderboard:
    get:
      tags: [Profil]
      summary: Reyting
      security:
        - bearerAuth: []
        - {}
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [week, all], default: week } }
        - { name: limit,  in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Reyting
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      period: { type: string }
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/UserPublic'
                            - type: object
                              properties:
                                rank:   { type: integer }
                                points: { type: integer }
                                isMe:   { type: boolean }

  # -------------------------------------------------------------- O'rganish

  /v1/learn:
    get:
      tags: [O‘rganish]
      summary: O‘rganish ekrani — butun ekran bitta so‘rovda
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: O‘rganish
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      quizzes:
                        type: array
                        items: { $ref: '#/components/schemas/Quiz' }
                      caseOfWeek:  { $ref: '#/components/schemas/CaseBrief' }
                      casesSolved: { type: integer }
                      casesNew:    { type: integer }
                      overview:    { $ref: '#/components/schemas/ReadingOverview' }
                      dailyGoal:   { $ref: '#/components/schemas/DailyGoal' }
                      points:      { type: integer }
                      streakDays:  { type: integer }
                      achievements:
                        type: array
                        items: { $ref: '#/components/schemas/Achievement' }

  /v1/quizzes:
    get:
      tags: [O‘rganish]
      summary: Testlar
      security:
        - bearerAuth: []
        - {}
      parameters:
        - { name: difficulty, in: query, schema: { type: string, enum: [boshlangich, orta, murakkab] } }
        - { name: topic,      in: query, schema: { type: string } }
      responses:
        '200':
          description: Testlar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Quiz' }

  /v1/quizzes/{id}:
    get:
      tags: [O‘rganish]
      summary: Bitta test
      description: Savol matnlarini bermaydi — ular urinish ochilganda qaytadi.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: 'id yoki slug', example: shaxsiy-huquqlar }
      responses:
        '200':
          description: Test
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      quiz: { $ref: '#/components/schemas/Quiz' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/quizzes/{id}/attempts:
    post:
      tags: [O‘rganish]
      summary: Urinish boshlash
      description: |
        Tugallanmagan urinish bo‘lsa, yangisi ochilmaydi — o‘shasi qaytadi,
        shuning uchun ilova «Davom etish» holatini qo‘lda kuzatmasa ham bo‘ladi.

        To‘g‘ri javob variantlari javobda **ko‘rsatilmaydi**: `isCorrect` maydoni
        faqat javob berilgan savollarda paydo bo‘ladi.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: 'id yoki slug' }
      responses:
        '200':
          description: Urinish
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      attempt: { $ref: '#/components/schemas/Attempt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Testda savol yo‘q
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/attempts/{id}:
    get:
      tags: [O‘rganish]
      summary: Urinish holati
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Urinish
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      attempt: { $ref: '#/components/schemas/Attempt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/attempts/{id}/answers:
    post:
      tags: [O‘rganish]
      summary: Savolga javob berish
      description: |
        To‘g‘ri javob, izoh va tegishli modda **shu javobda** qaytadi — ilova
        ularni oldindan bilmaydi. Bitta savolga ikkinchi marta javob berish
        `409` bilan rad qilinadi. Oxirgi savol javoblansa, `result` ham qaytadi.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId]
              properties:
                questionId: { type: integer }
                optionId:
                  type: integer
                  nullable: true
                  description: 'null — javobsiz qoldirish (xato deb hisoblanadi)'
                seconds: { type: integer, minimum: 0, maximum: 3600 }
      responses:
        '200':
          description: Javob natijasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      isCorrect:       { type: boolean }
                      correctOptionId: { type: integer, nullable: true }
                      pointsEarned:    { type: integer, example: 20 }
                      points:          { type: integer, description: Yangi umumiy ball }
                      explanation:     { type: string }
                      article:         { $ref: '#/components/schemas/ArticleRef' }
                      answered:        { type: integer }
                      total:           { type: integer }
                      result:
                        allOf:
                          - $ref: '#/components/schemas/AttemptResult'
                        nullable: true
                        description: Oxirgi savol javoblansa to‘ladi
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Allaqachon javob berilgan yoki urinish tugagan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/attempts/{id}/finish:
    post:
      tags: [O‘rganish]
      summary: Urinishni tugatish
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Natija
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/AttemptResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/daily-question:
    get:
      tags: [O‘rganish]
      summary: Kunlik savol
      description: Bir kunga bitta, hamma foydalanuvchiga bir xil.
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Savol
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      question: { $ref: '#/components/schemas/DailyQuestion' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/daily-question/answer:
    post:
      tags: [O‘rganish]
      summary: Kunlik savolga javob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionId]
              properties:
                optionId: { type: integer }
                seconds:  { type: integer, minimum: 0, maximum: 3600 }
      responses:
        '200':
          description: Javob natijasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      isCorrect:       { type: boolean }
                      correctOptionId: { type: integer, nullable: true }
                      pointsEarned:    { type: integer }
                      points:          { type: integer }
                      streakDays:      { type: integer }
                      explanation:     { type: string }
                      article:         { $ref: '#/components/schemas/ArticleRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Bugun allaqachon javob berilgan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # --------------------------------------------------------------- Kazuslar

  /v1/case-categories:
    get:
      tags: [Kazuslar]
      summary: Kazus kategoriyalari
      security: []
      responses:
        '200':
          description: Kategoriyalar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CaseCategory' }
        '304': { description: O‘zgarmagan }

  /v1/cases:
    get:
      tags: [Kazuslar]
      summary: Kazuslar ro‘yxati
      security:
        - bearerAuth: []
        - {}
      parameters:
        - { name: category,   in: query, schema: { type: string }, example: talim }
        - { name: difficulty, in: query, schema: { type: integer, enum: [1, 2, 3] } }
        - { name: status,     in: query, schema: { type: string, enum: [new, in_progress, solved] }, description: Urinish holati (token kerak) }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Kazuslar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CaseBrief' }
                      categories:
                        type: array
                        items: { $ref: '#/components/schemas/CaseCategory' }

  /v1/cases/of-the-week:
    get:
      tags: [Kazuslar]
      summary: Haftaning kazusi
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Kazus
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      case: { $ref: '#/components/schemas/CaseBrief' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cases/{key}:
    get:
      tags: [Kazuslar]
      summary: Bitta kazus
      description: |
        Modda variantlarida `isCorrect` **yo‘q** — u faqat `check` dan keyin
        paydo bo‘ladi. Huquqshunos izohi (`commentary`) ham tekshirishdan
        oldin `null` bo‘ladi.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/caseKey'
      responses:
        '200':
          description: Kazus
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      case: { $ref: '#/components/schemas/Case' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cases/{key}/draft:
    post:
      tags: [Kazuslar]
      summary: Oraliq saqlash
      description: 1 va 2-bosqichdagi holatni saqlaydi, hech narsa bahlolanmaydi.
      parameters:
        - $ref: '#/components/parameters/caseKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                step:     { type: integer, minimum: 1, maximum: 3 }
                selected: { type: array, items: { type: integer }, description: Tanlangan modda raqamlari }
                solution: { type: string, maxLength: 4000 }
      responses:
        '200':
          description: Saqlandi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      attemptId: { type: integer }
                      step:      { type: integer }
                      status:    { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Kazus allaqachon yechilgan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/cases/{key}/check:
    post:
      tags: [Kazuslar]
      summary: Javobni tekshirish
      description: |
        Baholaydi, ball beradi va huquqshunos izohini ochadi.
        Hammasi to‘g‘ri — 40 ball; qisman — 15 ball; mutlaqo xato — 0.
        Takroriy tekshirish ball bermaydi (`pointsEarned: 0`).
      parameters:
        - $ref: '#/components/parameters/caseKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selected]
              properties:
                selected:
                  type: array
                  items: { type: integer }
                  minItems: 1
                  description: Tanlangan modda raqamlari
                  example: [31]
                solution: { type: string, maxLength: 4000 }
      responses:
        '200':
          description: Natija
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      attemptId:    { type: integer }
                      score:        { type: integer, example: 40 }
                      pointsEarned: { type: integer }
                      points:       { type: integer }
                      streakDays:   { type: integer }
                      isPerfect:    { type: boolean }
                      isPartial:    { type: boolean }
                      title:        { type: string, example: 'Ajoyib! +40 ball' }
                      subtitle:     { type: string }
                      correct:      { type: array, items: { type: integer } }
                      hit:          { type: array, items: { type: integer } }
                      extra:        { type: array, items: { type: integer }, description: Keraksiz tanlanganlar }
                      missed:       { type: array, items: { type: integer }, description: Tanlanmay qolganlar }
                      marks:
                        type: array
                        items:
                          type: object
                          properties:
                            number:    { type: integer }
                            picked:    { type: boolean }
                            isCorrect: { type: boolean }
                            mark:      { type: string, enum: [correct, wrong, missed, neutral] }
                            note:      { type: string, nullable: true }
                      commentary: { $ref: '#/components/schemas/CaseCommentary' }
                      achievements:
                        type: array
                        items: { $ref: '#/components/schemas/Achievement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/cases/{key}/reset:
    post:
      tags: [Kazuslar]
      summary: Qaytadan yechish
      parameters:
        - $ref: '#/components/parameters/caseKey'
      responses:
        '200':
          description: Urinish o‘chirildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { status: { type: string, example: new } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------- Hamjamiyat

