                  type: array
                  items: { type: string, maxLength: 40 }
                  maxItems: 5
      responses:
        '201':
          description: Yaratildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      post: { $ref: '#/components/schemas/Post' }
