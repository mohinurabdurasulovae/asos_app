      parameters:
        - { name: id,     in: path,  required: true, schema: { type: integer } }
        - { name: before, in: query, schema: { type: integer }, description: Shu id'dan oldingi xabarlar }
        - { name: limit,  in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Xabarlar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Yordam]
      summary: Xabar yuborish
      description: Matn yoki modda havolasi (yoki ikkisi birga) bo‘lishi kerak.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 4000 }
                articleNumbers:
                  type: array
                  items: { type: integer }
                  maxItems: 5
                  description: Xabarga ilova qilinadigan modda raqamlari
                  example: [31]
      responses:
        '201':
          description: Yuborildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      message: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/conversations/{id}/read:
    post:
      tags: [Yordam]
      summary: Xabarlarni o‘qildi deb belgilash
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Belgilandi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { unreadCount: { type: integer, example: 0 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ai/suggestions:
    get:
      tags: [Yordam]
      summary: AI uchun tayyor so‘rovlar
      security: []
      responses:
        '200':
          description: Tavsiyalar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      items:      { type: array, items: { type: string } }
                      disclaimer: { type: string }

  /v1/ai/ask:
    post:
      tags: [Yordam]
      summary: AI yordamchidan so‘rash
      description: |
        Vaziyatni matn bilan yuboradi; javobda tegishli moddalar va ularning
        sodda tilidagi izohi qaytadi. Model kontekst sifatida **faqat bazadagi
        moddalar matnini** ko‘radi, shuning uchun o‘ylab topilgan modda
        raqami bo‘lmaydi.

        `driver: stub` bo‘lsa tashqi xizmat ishlatilmaydi — javob bazadagi
        moddalardan yig‘iladi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:     { type: string, minLength: 10, maxLength: 2000 }
                threadId: { type: integer, description: Mavjud suhbatni davom ettirish }
      responses:
        '200':
          description: Javob
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      threadId: { type: integer }
                      answer:   { type: string }
                      articles:
                        type: array
                        items:
                          type: object
                          properties:
                            number:  { type: integer }
                            title:   { type: string }
                            slug:    { type: string }
                            bullets: { type: array, items: { type: string } }
                      disclaimer: { type: string }
                      driver:     { type: string, enum: [stub, anthropic] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/ai/threads:
    get:
      tags: [Yordam]
      summary: AI suhbatlari
      responses:
        '200':
          description: Suhbatlar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:        { type: integer }
                            title:     { type: string }
                            updatedAt: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/ai/threads/{id}:
    get:
      tags: [Yordam]
      summary: AI suhbat tarixi
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Tarix
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      thread:
                        type: object
                        properties:
                          id:        { type: integer }
                          title:     { type: string }
                          createdAt: { type: string }
                          messages:
                            type: array
                            items:
                              type: object
                              properties:
                                id:        { type: integer }
                                role:      { type: string, enum: [user, assistant] }
                                body:      { type: string }
                                articles:  { type: array, items: { type: integer } }
                                createdAt: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/callback-requests:
    post:
      tags: [Yordam]
      summary: «Menga qo‘ng‘iroq qiling»
      description: Tokensiz ham ishlaydi. Token bo‘lsa, raqam profildan olinadi.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string, example: '+998901234567' }
                topic: { type: string, maxLength: 190, example: Ijara }
      responses:
        '201':
          description: Qabul qilindi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      requestId: { type: integer }
                      phone:     { type: string }
                      status:    { type: string }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/bookings:
    get:
      tags: [Yordam]
      summary: Band qilingan vaqtlar
      responses:
        '200':
          description: Band qilishlar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Yordam]
      summary: Advokat vaqtini band qilish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lawyerId, slotAt]
              properties:
                lawyerId: { type: integer }
                slotAt:   { type: string, example: '2026-11-21 15:00' }
                note:     { type: string, maxLength: 255 }
      responses:
        '201':
          description: Band qilindi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      bookingId: { type: integer }
                      slotAt:    { type: string }
                      status:    { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Bu vaqt band
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/bookings/{id}:
    delete:
      tags: [Yordam]
      summary: Band qilishni bekor qilish
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Bekor qilindi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { status: { type: string, example: cancelled } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

# =====================================================================

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: '`POST /v1/auth/verify` bergan `token.accessToken`.'

  parameters:
    page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    perPage:
      name: perPage
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    articleKey:
      name: key
      in: path
      required: true
      description: >
        Modda raqami (`50`) yoki slug'i. Muqaddima uchun `muqaddima`.
      schema: { type: string }
      example: '50'
    caseKey:
      name: key
      in: path
      required: true
      description: Kazus raqami (`14`) yoki slug'i
      schema: { type: string }
      example: '14'

  responses:
    Unauthorized:
      description: Token yo‘q, yaroqsiz yoki muddati tugagan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { ok: false, error: unauthorized, message: 'Avval tizimga kiring.' }
    Forbidden:
      description: Ruxsat yo‘q
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Topilmadi
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validation:
      description: Kirish ma’lumotlari xato
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  field:   { type: string, description: Xato maydon nomi }
                  allowed: { type: array, items: { type: string } }
          example:
            ok: false
            error: bad_phone
            message: 'Telefon raqam +998 va 9 ta raqamdan iborat bo‘lishi kerak. Masalan: 90 123 45 67.'
            field: phone
    ServerError:
      description: Server xatosi
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Ok:
      type: object
      properties:
        ok: { type: boolean, enum: [true] }
      required: [ok]

    Error:
      type: object
      required: [ok, error, message]
      properties:
        ok:      { type: boolean, enum: [false] }
        error:   { type: string, description: Mashina o‘qiydigan kod }
        message: { type: string, description: Ilovada ko‘rsatishga yaroqli o‘zbekcha matn }

    ListMeta:
      type: object
      properties:
        total:   { type: integer }
        page:    { type: integer }
        perPage: { type: integer }
        pages:   { type: integer }
        hasMore: { type: boolean }

    ListResponse:
      type: object
      properties:
        ok:    { type: boolean, enum: [true] }
        items: { type: array, items: { type: object } }
        meta:  { $ref: '#/components/schemas/ListMeta' }

    Token:
      type: object
      properties:
        accessToken: { type: string, description: Bir marta beriladi; bazada faqat hash saqlanadi }
        expiresAt:   { type: string }
        tokenType:   { type: string, enum: [Bearer] }

    Session:
      type: object
      properties:
        id:         { type: integer }
        device:     { type: string }
        createdAt:  { type: string }
        lastUsedAt: { type: string, nullable: true }
        expiresAt:  { type: string }
        isCurrent:  { type: boolean }

    Level:
      type: object
      properties:
        level:     { type: integer }
        title:     { type: string, example: Bilimdon }
        minPoints: { type: integer }

    UserPublic:
      type: object
      properties:
        id:        { type: integer }
        name:      { type: string }
        username:  { type: string, nullable: true }
        initials:  { type: string, example: AK }
        avatarUrl: { type: string, nullable: true }
        city:      { type: string, nullable: true }
        role:      { type: string, enum: [user, lawyer, moderator, admin] }
        points:    { type: integer }
        level:
          type: object
          properties:
            number:    { type: integer }
            title:     { type: string }
            minPoints: { type: integer }
            nextAt:    { type: integer, nullable: true, description: Keyingi darajaga kerak bo‘lgan ball }
        streakDays: { type: integer }

    Me:
      allOf:
        - $ref: '#/components/schemas/UserPublic'
        - type: object
          properties:
            phone:       { type: string, nullable: true }
            email:       { type: string, nullable: true }
            dailyGoal:   { type: integer }
            locale:      { type: string }
            textSize:    { type: string }
            notifyDaily: { type: boolean }
            createdAt:   { type: string }

    Author:
      type: object
      description: Anonim bo‘lsa `id` va ism oshkor qilinmaydi.
      properties:
        id:          { type: integer, nullable: true }
        name:        { type: string, example: Anonim }
        username:    { type: string, nullable: true }
        initials:    { type: string }
        avatarUrl:   { type: string, nullable: true }
        isAnonymous: { type: boolean }
        isLawyer:    { type: boolean }
        lawyerId:    { type: integer, nullable: true }
        isVerified:  { type: boolean }

    ConstitutionStats:
      type: object
      description: >
        Bazadagi tuzilish. Hozirgi holat: 6 bo‘lim, 27 bob, 155 modda
        (muqaddima alohida yozuv, bu songa kirmaydi).
      properties:
        edition:  { type: string, example: '2023' }
        sections: { type: integer, example: 6 }
        chapters: { type: integer, example: 27 }
        articles: { type: integer, example: 155 }
        source:   { type: string }

    Chapter:
      type: object
      properties:
        id:           { type: integer }
        roman:        { type: string, example: IX }
        title:        { type: string }
        articleFrom:  { type: integer, example: 41 }
        articleTo:    { type: integer, example: 53 }
        articleCount: { type: integer, example: 13 }
        readCount:    { type: integer, example: 8 }
        percent:      { type: integer, example: 62 }
        status:       { type: string, enum: [not_started, in_progress, done] }

    Section:
      type: object
      properties:
        id:           { type: integer }
        roman:        { type: string, example: II }
        title:        { type: string }
        articleFrom:  { type: integer }
        articleTo:    { type: integer }
        chapterCount:
          type: integer
          description: >
            VI bo‘limda bob yo‘q (`0`) — 154 va 155-moddalar bevosita
            bo‘limga tegishli.
        articleCount:
          type: integer
          description: Bo‘limdagi moddalar soni; boblarga kirmaganlari ham sanaladi.
        readCount:    { type: integer }
        percent:      { type: integer }
        chapters:
          type: array
          items: { $ref: '#/components/schemas/Chapter' }

    Topic:
      type: object
      properties:
        id:           { type: integer }
        slug:         { type: string, example: talim }
        title:        { type: string, example: Ta’lim }
        icon:         { type: string }
        tone:         { type: string, description: 'Dizayn tizimidagi rang nomi: brand, teal, orange, purple, pink, navy' }
        articleCount: { type: integer }

    ArticleRef:
      type: object
      nullable: true
      properties:
        number: { type: integer }
        title:  { type: string }
        slug:   { type: string }

    ReadingProgress:
      type: object
      nullable: true
      properties:
        status:     { type: string, enum: [reading, read] }
        seconds:    { type: integer }
        lastReadAt: { type: string }

    ArticleBrief:
      type: object
      properties:
        id:             { type: integer }
        number:         { type: integer, example: 50 }
        title:          { type: string, example: Ta’lim olish huquqi }
        titleAuto:
          type: boolean
          description: >
            true — moddaning tahririy sarlavhasi yo‘q va `title` shunchaki
            «130-modda». Rasmiy matnda sarlavhalar umuman yo‘q; 155 moddadan
            12 tasiga tahririy sarlavha berilgan. true bo‘lsa, ro‘yxatda
            sarlavha o‘rniga `excerpt` ni ko‘rsating.
          example: false
        slug:           { type: string }
        chapterId:      { type: integer, nullable: true }
        chapterRoman:   { type: string, nullable: true }
        chapterTitle:   { type: string, nullable: true }
        readingMinutes: { type: integer }
        isPreamble:     { type: boolean }
        excerpt:
          type: string
          nullable: true
          description: Rasmiy matnning boshi (160 belgigacha) — ro‘yxatlarda ko‘rsatish uchun.
          example: Har kim ta’lim olish huquqiga ega. Davlat uzluksiz ta’lim tizimi…
        progress:       { $ref: '#/components/schemas/ReadingProgress' }

    ArticlePart:
      type: object
      properties:
        partNo:    { type: integer }
        body:      { type: string, description: Rasmiy matn — serif shriftda ko‘rsatiladi }
        highlight:
          type: array
          items: { type: string }
          description: Matn ichida belgilanadigan iboralar
        isExtra:   { type: boolean }

    Article:
      type: object
      properties:
        id:             { type: integer }
        number:         { type: integer }
        title:          { type: string }
        titleAuto:
          type: boolean
          description: true — tahririy sarlavha yo‘q, `title` moddaning raqami.
        slug:           { type: string }
        readingMinutes: { type: integer }
        effectiveFrom:  { type: string, nullable: true, example: '2023-05-01' }
        isPreamble:     { type: boolean }
        section:
          type: object
          nullable: true
          properties:
            roman: { type: string }
            title: { type: string }
        chapter:
          type: object
          nullable: true
          properties:
            id:    { type: integer }
            roman: { type: string }
            title: { type: string }
        topics:
          type: array
          items:
            type: object
            properties:
              slug:  { type: string }
              title: { type: string }
              tone:  { type: string }
        parts:
          type: array
          minItems: 1
          description: >
            Moddaning rasmiy matni, bandlarga ajratilgan. Barcha 155 moddada
            to‘ldirilgan. Muqaddimada 10 band.
          items: { $ref: '#/components/schemas/ArticlePart' }
        plain:
          type: object
          nullable: true
          description: «Sodda qilib aytganda» bo‘limi
          properties:
            bullets:    { type: array, items: { type: string } }
            reviewedBy: { type: string, nullable: true }
            reviewedAt: { type: string, nullable: true }
            disclaimer: { type: string }
        examples:
          type: array
          items:
            type: object
            properties:
              id:          { type: integer }
              situation:   { type: string }
              verdict:     { type: string }
              verdictKind: { type: string, enum: [ok, bad] }
        related:
          type: array
          items:
            type: object
            properties:
              number: { type: integer }
              title:  { type: string }
              slug:   { type: string }
              note:   { type: string, nullable: true }
        terms:
          type: array
          items: { $ref: '#/components/schemas/TermBrief' }
        discussion:
          type: object
          properties:
            count:     { type: integer }
            lastId:    { type: integer, nullable: true }
            lastTitle: { type: string, nullable: true }
        quiz:
          type: object
          nullable: true
          properties:
            id:    { type: integer }
            slug:  { type: string }
            title: { type: string }
        prev:     { type: integer, nullable: true }
        next:     { type: integer, nullable: true }
        progress: { $ref: '#/components/schemas/ReadingProgress' }
        isSaved:  { type: boolean }
        source:   { type: string }

    ArticleOfDay:
      type: object
      nullable: true
      properties:
        number: { type: integer }
        title:  { type: string }
        slug:   { type: string }
        quote:  { type: string }
        partNo: { type: integer }
        chapter:
          type: object
          nullable: true
          properties:
            roman: { type: string }
            title: { type: string }

    Letter:
      type: object
      properties:
        letter: { type: string, example: O‘ }
        count:  { type: integer }

    TermBrief:
      type: object
      properties:
        id:       { type: integer }
        term:     { type: string, example: Daxlsizlik }
        slug:     { type: string }
        letter:   { type: string }
        shortDef: { type: string }
        articles: { type: array, items: { type: integer }, description: Modda raqamlari }
        isSaved:  { type: boolean }

    Term:
      type: object
      properties:
        id:           { type: integer }
        term:         { type: string }
        slug:         { type: string }
        letter:       { type: string }
        partOfSpeech: { type: string, nullable: true, example: ot }
        etymology:    { type: string, nullable: true, example: 'arabcha “daxl” — tegish' }
        definition:   { type: string }
        inLife:       { type: string, nullable: true, description: «Hayotda» bo‘limi }
        shortDef:     { type: string }
        articles:
          type: array
          items: { $ref: '#/components/schemas/ArticleRef' }
        isSaved:      { type: boolean }

    ReadingOverview:
      type: object
      properties:
        articlesTotal: { type: integer, example: 155 }
        articlesRead:  { type: integer, example: 59 }
        percent:       { type: integer, example: 38 }
        continue:
          type: object
          nullable: true
          description: «Davom ettiring» kartasi
          properties:
            lastArticle:
              type: object
              properties:
                number:         { type: integer }
                title:          { type: string }
                slug:           { type: string }
                status:         { type: string }
                readingMinutes: { type: integer }
                minutesLeft:    { type: integer }
            chapter:
              type: object
              nullable: true
              properties:
                id:           { type: integer }
                roman:        { type: string }
                title:        { type: string }
                articleCount: { type: integer }
                readCount:    { type: integer }
                percent:      { type: integer }
            nextArticle:
              type: object
              nullable: true
              properties:
                number: { type: integer }
                title:  { type: string }

    DailyGoal:
      type: object
      properties:
        goal:      { type: integer, example: 3 }
        done:      { type: integer, example: 2 }
        rawDone:   { type: integer }
        completed: { type: boolean }

    WeekActivity:
      type: object
      description: Profildagi Du–Ya ustunchalari
      properties:
        days:
          type: array
          items:
            type: object
            properties:
              label:    { type: string, example: Du }
              date:     { type: string }
              minutes:  { type: integer }
              lessons:  { type: integer }
              isToday:  { type: boolean }
              isFuture: { type: boolean }
        totalMinutes: { type: integer, example: 42 }
        activeDays:   { type: integer, example: 6 }

    Achievement:
      type: object
      properties:
        id:        { type: integer }
        slug:      { type: string }
        title:     { type: string, example: 7 kunlik seriya }
        hint:      { type: string }
        icon:      { type: string }
        tone:      { type: string }
        metric:    { type: string, enum: [articles_read, quizzes_done, cases_solved, streak_days, points, terms_saved, posts_written] }
        threshold: { type: integer }
        progress:  { type: integer }
        earned:    { type: boolean }
        earnedAt:  { type: string, nullable: true }

    Notification:
      type: object
      properties:
        id:        { type: integer }
        kind:      { type: string, enum: [comment, lawyer_answer, achievement, message, daily] }
        title:     { type: string }
        body:      { type: string }
        link:      { type: string, nullable: true }
        isRead:    { type: boolean }
        createdAt: { type: string }

    Quiz:
      type: object
      properties:
        id:            { type: integer }
