                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      sort: { type: string }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PostBrief' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Hamjamiyat]
      summary: Savol berish
