        `answered` holatiga o‘tadi. `parentId` uchinchi qatlamga tushmaydi —
        chuqur javob avtomatik ildizga ko‘tariladi.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
